<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fusion Business Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#0c1424;
  --navy-900:#101a2e;
  --navy-800:#16223b;
  --navy-700:#1e2d4a;
  --navy-600:#2a3d63;
  --ink-900:#111827;
  --ink-700:#374151;
  --ink-500:#6b7280;
  --ink-400:#9aa3b2;
  --line:#e6e9ef;
  --paper:#f5f6f9;
  --card:#ffffff;
  --brand:#2f5df5;
  --brand-dark:#1f43c9;
  --teal:#0ea885;
  --teal-soft:#e3f8f2;
  --amber:#c97a1a;
  --amber-soft:#fbf0dd;
  --red:#c2372c;
  --red-soft:#fbe9e7;
  --blue-soft:#e8eefd;
  --violet:#6a4fd6;
  --violet-soft:#efeafb;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --shadow-1: 0 1px 2px rgba(16,26,46,0.06), 0 1px 1px rgba(16,26,46,0.04);
  --shadow-2: 0 8px 24px -8px rgba(16,26,46,0.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--paper);
  color:var(--ink-900);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.45;
}
.font-display{font-family:'Space Grotesk','Inter',sans-serif;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#cbd3e0;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
table{border-collapse:collapse;width:100%;}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:240px;flex-shrink:0;background:var(--navy-950);
  color:#c7cfe0;display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;z-index:40;
  transition:transform .25s ease;
}
.sidebar-brand{
  display:flex;align-items:center;gap:10px;padding:20px 20px 16px 20px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.sidebar-brand .mark{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--brand),var(--violet));
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk';font-weight:700;color:#fff;font-size:15px;
  flex-shrink:0;
}
.sidebar-brand .name{font-family:'Space Grotesk';font-weight:600;color:#fff;font-size:15px;line-height:1.2;}
.sidebar-brand .sub{font-size:10.5px;color:#7c8aab;letter-spacing:.03em;margin-top:1px;}
.sidebar-nav{flex:1;overflow-y:auto;padding:14px 10px;}
.nav-section-label{
  font-size:10.5px;font-weight:600;color:#5b6a8c;letter-spacing:.06em;
  padding:14px 10px 6px 10px;
}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;
  color:#aab4cb;font-size:13.5px;font-weight:500;margin-bottom:2px;
  transition:background .12s, color .12s; position:relative;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;cursor:pointer;}
.nav-item.active{background:rgba(47,93,245,0.16);color:#fff;}
.nav-item.active svg{opacity:1;color:#6f8dff;}
.nav-item.active::before{
  content:'';position:absolute;left:-10px;top:6px;bottom:6px;width:3px;
  border-radius:2px;background:var(--brand);
}
.sidebar-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,0.08);}
.role-pill{
  font-size:10.5px;font-weight:600;letter-spacing:.03em;color:#8fa1ff;
  background:rgba(111,141,255,0.14);padding:3px 8px;border-radius:20px;display:inline-block;
}

.main{margin-left:240px;flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}
.topbar{
  height:60px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;position:sticky;top:0;z-index:30;flex-shrink:0;
  gap:16px;
}
.crumbs{font-size:12.5px;color:var(--ink-500);display:flex;align-items:center;gap:6px;}
.crumbs b{color:var(--ink-900);font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--paper);
  border:1px solid var(--line);border-radius:8px;padding:7px 12px;width:260px;
}
.search-box input{border:none;background:transparent;outline:none;font-size:13px;width:100%;color:var(--ink-900);}
.search-box svg{width:15px;height:15px;color:var(--ink-400);flex-shrink:0;}
.icon-btn{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;color:var(--ink-500);position:relative;
}
.icon-btn:hover{background:var(--paper);}
.icon-btn svg{width:16px;height:16px;}
.notif-dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid #fff;}
.profile-chip{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 5px;border-radius:30px;border:1px solid var(--line);background:#fff;}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--violet));color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'Space Grotesk';}
.profile-chip .pname{font-size:12.5px;font-weight:600;color:var(--ink-900);}
.profile-chip .prole{font-size:10.5px;color:var(--ink-500);}

.content{padding:24px;flex:1;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.page-title{font-family:'Space Grotesk';font-size:21px;font-weight:600;color:var(--ink-900);}
.page-sub{font-size:12.5px;color:var(--ink-500);margin-top:2px;}

/* ---------- Components ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;
  padding:8px 14px;border-radius:8px;border:1px solid transparent;transition:filter .1s, transform .05s;
}
.btn:active{transform:translateY(1px);}
.btn svg{width:14px;height:14px;}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-outline{background:#fff;border-color:var(--line);color:var(--ink-700);}
.btn-outline:hover{background:var(--paper);}
.btn-ghost{background:transparent;color:var(--ink-500);}
.btn-ghost:hover{color:var(--ink-900);}
.btn-danger{background:var(--red-soft);color:var(--red);}
.btn-sm{padding:6px 10px;font-size:12px;}

.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:18px;box-shadow:var(--shadow-1);
}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.card-title{font-size:14px;font-weight:600;color:var(--ink-900);}
.card-title-sub{font-size:11.5px;color:var(--ink-500);margin-top:1px;}

.kpi{padding:17px 18px;}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;}
.kpi-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.kpi-icon svg{width:17px;height:17px;}
.kpi-label{font-size:12px;color:var(--ink-500);font-weight:500;margin-top:12px;}
.kpi-value{font-family:'Space Grotesk';font-size:24px;font-weight:700;color:var(--ink-900);margin-top:3px;}
.kpi-delta{font-size:11.5px;font-weight:600;margin-top:7px;display:flex;align-items:center;gap:4px;}
.kpi-delta svg{width:11px;height:11px;}
.up{color:var(--teal);} .down{color:var(--red);}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.badge-dot{width:6px;height:6px;border-radius:50%;}
.badge-green{background:var(--teal-soft);color:var(--teal);}
.badge-amber{background:var(--amber-soft);color:var(--amber);}
.badge-red{background:var(--red-soft);color:var(--red);}
.badge-blue{background:var(--blue-soft);color:var(--brand-dark);}
.badge-gray{background:#eef0f4;color:var(--ink-500);}
.badge-violet{background:var(--violet-soft);color:var(--violet);}

table.data-table{font-size:13px;}
table.data-table thead th{
  text-align:left;font-size:11px;font-weight:600;color:var(--ink-500);
  letter-spacing:.02em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfc;
}
table.data-table tbody td{padding:11px 12px;border-bottom:1px solid #f0f1f4;color:var(--ink-700);vertical-align:middle;}
table.data-table tbody tr:hover{background:#fafbfd;}
table.data-table tbody tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;border-radius:var(--radius-md);}
.cell-strong{color:var(--ink-900);font-weight:600;}
.cell-sub{font-size:11.5px;color:var(--ink-500);}

.progress-track{height:6px;border-radius:4px;background:#eef0f4;overflow:hidden;}
.progress-fill{height:100%;border-radius:4px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;}
.tab{padding:9px 4px;margin-right:20px;font-size:13px;font-weight:600;color:var(--ink-500);border-bottom:2px solid transparent;}
.tab.active{color:var(--brand-dark);border-color:var(--brand);}
.tab:hover{color:var(--ink-900);cursor:pointer;}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.toolbar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11.5px;font-weight:600;color:var(--ink-700);}
.input, select.input, textarea.input{
  border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13px;
  background:#fff;color:var(--ink-900);outline:none;
}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,93,245,0.12);}
.filter-input{border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12.5px;background:#fff;color:var(--ink-700);}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;text-align:center;color:var(--ink-500);}
.empty-state svg{width:38px;height:38px;color:var(--ink-400);margin-bottom:12px;}
.empty-state .et{font-size:14px;font-weight:600;color:var(--ink-700);margin-bottom:4px;}
.empty-state .ed{font-size:12.5px;max-width:320px;}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(16,20,32,0.5);display:flex;align-items:center;justify-content:center;
  z-index:100;animation:fadeIn .15s ease;padding:20px;
}
.modal{
  background:#fff;border-radius:var(--radius-lg);width:520px;max-width:100%;max-height:88vh;overflow-y:auto;
  box-shadow:var(--shadow-2);animation:pop .16s ease;
}
.modal-lg{width:680px;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);}
.modal-title{font-size:15.5px;font-weight:600;font-family:'Space Grotesk';}
.modal-body{padding:20px;}
.modal-foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}

.toast-wrap{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{
  min-width:280px;background:#16223b;color:#fff;padding:12px 16px;border-radius:10px;
  display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-2);
  animation:slideIn .2s ease;
}
.toast svg{width:16px;height:16px;flex-shrink:0;}
.toast.success{background:#0d3b30;} .toast.success svg{color:#4ade80;}
.toast.error{background:#3b1414;} .toast.error svg{color:#f87171;}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}

.skeleton{background:linear-gradient(90deg,#eef0f4 25%,#f6f7f9 37%,#eef0f4 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:6px;}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

.login-wrap{min-height:100vh;display:flex;}
.login-left{flex:1.1;background:radial-gradient(circle at 20% 20%, #1c2c52, #0c1424 60%);position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:48px;}
.login-right{flex:1;display:flex;align-items:center;justify-content:center;background:#fff;padding:30px;}
.login-card{width:380px;max-width:100%;}
.login-grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.04) 1px,transparent 1px);background-size:36px 36px;}
.demo-role-btn{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;font-size:12.5px;}
.demo-role-btn:hover{border-color:var(--brand);background:var(--blue-soft);cursor:pointer;}

.checkbox-row{display:flex;align-items:center;gap:8px;}

.pagination{display:flex;align-items:center;justify-content:space-between;padding-top:14px;font-size:12.5px;color:var(--ink-500);}
.page-btns{display:flex;gap:4px;}
.page-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff;}
.page-btn.active{background:var(--navy-950);color:#fff;border-color:var(--navy-950);}

.divider{height:1px;background:var(--line);margin:16px 0;}

.stat-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f2f3f6;}
.stat-row:last-child{border-bottom:none;}

.mobile-topbar{display:none;}
@media(max-width:980px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .grid-4{grid-template-columns:1fr 1fr;}
  .grid-3, .grid-2{grid-template-columns:1fr;}
  .search-box{display:none;}
  .content{padding:16px;}
}
.sidebar-overlay{display:none;}
@media(max-width:980px){
  .sidebar-overlay.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:35;}
}
.hamburger{display:none;}
@media(max-width:980px){.hamburger{display:flex;}}

.chart-box{width:100%;position:relative;}
.chart-box svg{width:100%;height:100%;display:block;overflow:visible;}
.chart-legend{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:10px;font-size:11.5px;color:var(--ink-500);}
.chart-legend .li{display:flex;align-items:center;gap:6px;}
.chart-legend .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block;}
.chart-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-400);font-size:12.5px;}
.chart-tip{position:absolute;pointer-events:none;background:#16223b;color:#fff;font-size:11px;padding:5px 8px;border-radius:6px;transform:translate(-50%,-115%);white-space:nowrap;z-index:5;opacity:0;transition:opacity .1s;}

.fade-in{animation:fadeUp .18s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

<div id="root"></div>

const VAT_RATE = 0.175; // 17.5% VAT applied to every invoice

let SALES = [];
let INVOICES = [];
let invCounter = 1;
function genSale(dt, forceId){
  const nItems = 1+Math.floor(Math.random()*3);
  const items = [];
  let subtotal = 0;
  const used = new Set();
  for(let i=0;i<nItems;i++){
    let p = PRODUCTS[Math.floor(Math.random()*PRODUCTS.length)];
    if(used.has(p.id)) continue;
    used.add(p.id);
    const qty = 1+Math.floor(Math.random()*5);
    const lineTotal = qty*p.price;
    items.push({productId:p.id, name:p.name, qty, price:p.price, total:lineTotal});
    subtotal += lineTotal;
  }
  const discount = Math.random()<0.25 ? Math.round(subtotal*0.05) : 0;
  const taxable = subtotal - discount;
  const vat = Math.round(taxable*VAT_RATE);
  const total = taxable + vat;
  const methods = ['Cash','Bank','Mobile Money'];
  const method = methods[Math.floor(Math.random()*methods.length)];
  const statusRoll = Math.random();
  const payStatus = statusRoll<0.72?'Paid': (statusRoll<0.9?'Partially Paid':'Pending');
  const custIdx = Math.floor(Math.random()*CUSTOMERS.length);
  const saleId = forceId || 'TXN'+(9000+idc++);
  const invNo = 'INV-'+String(2026000+invCounter).slice(-4);
  invCounter++;
  const sale = {
    id:saleId, date:fmtDate(dt), items, subtotal, discount, taxable, vat, total, method,
    customer:CUSTOMERS[custIdx], payStatus, cashier: ['Grace Mwale','Bright Kamanga','Alinane Phiri'][Math.floor(Math.random()*3)],
    invoiceNo:invNo,
  };
  SALES.push(sale);
  INVOICES.push({
    invoiceNo:invNo, saleId, date:sale.date, customer:sale.customer, phone:'+265 99'+Math.floor(1000000+Math.random()*8999999),
    items, subtotal, discount, taxable, vat, total, status:payStatus, type:'Sale',
  });
  return sale;
}

  for(let i=0;i<count;i++) genSale(dt);
}

/* ============================= HELPERS: METRICS ============================= */
function todayStr(){ return fmtDate(new Date()); }
function salesOn(dateStr){ return SALES.filter(s=>s.date===dateStr); }
function salesInLastNDays(n){
  const cutoff = daysAgo(n-1); cutoff.setHours(0,0,0,0);
  return SALES.filter(s=> new Date(s.date+'T00:00:00') >= cutoff);
}
function monthSales(){
  const ms = fmtDate(new Date(now.getFullYear(), now.getMonth(),1));
  return SALES.filter(s=> s.date >= ms);
}
function totalStockValue(){ return PRODUCTS.reduce((a,p)=>a+p.stock*p.cost,0); }
function lowStockItems(){ return PRODUCTS.filter(p=>p.status==='Low Stock'); }
function outOfStockItems(){ return PRODUCTS.filter(p=>p.status==='Out of Stock'); }
function productSalesAgg(){
  const map = {};
  SALES.forEach(s=>s.items.forEach(it=>{
    if(!map[it.productId]) map[it.productId] = {productId:it.productId, name:it.name, unitsSold:0, revenue:0};
    map[it.productId].unitsSold += it.qty;
    map[it.productId].revenue += it.total;
  }));
  return Object.values(map).sort((a,b)=>b.unitsSold-a.unitsSold);
}
function employeesPresentToday(){
  const t = ATTENDANCE[todayStr()];
  if(!t) return {present:0,total:EMPLOYEES.length};
  const present = Object.values(t).filter(s=>s==='Present'||s==='Late').length;
  return {present, total:EMPLOYEES.length};
}
function outstandingInvoices(){ return INVOICES.filter(i=>i.status!=='Paid'); }

function statusBadge(status){
  const map = {
    'In Stock':'badge-green','Low Stock':'badge-amber','Out of Stock':'badge-red',
    'Paid':'badge-green','Pending':'badge-amber','Partially Paid':'badge-blue',
    'Active':'badge-green','Inactive':'badge-gray','On Leave':'badge-violet',
    'Present':'badge-green','Absent':'badge-red','Late':'badge-amber','Leave':'badge-violet',
  };
  return `<span class="badge ${map[status]||'badge-gray'}"><span class="badge-dot" style="background:currentColor;"></span>${status}</span>`;
}

/* ============================= CHARTS (dependency-free SVG) ============================= */
/* No external chart library is used — everything below renders plain, responsive SVG
   so the prototype never depends on a third-party script loading successfully. */
const PALETTE = {brand:'#2f5df5', teal:'#0ea885', amber:'#c97a1a', red:'#c2372c', violet:'#6a4fd6', navy:'#1e2d4a', ink:'#9aa3b2'};
function svgEl(tag, attrs){
  let s = '<'+tag+' ';
  for(const k in attrs) s += k+'="'+attrs[k]+'" ';
  return s+'/>';
}
function niceMax(v){
  if(v<=0) return 10;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const norm = v/mag;
  let n;
  if(norm<=1) n=1; else if(norm<=2) n=2; else if(norm<=5) n=5; else n=10;
  return n*mag;
}
function shortNum(v){
  if(Math.abs(v)>=1000000) return (v/1000000).toFixed(1)+'M';
  if(Math.abs(v)>=1000) return Math.round(v/1000)+'k';
  return String(Math.round(v));
}
function chartWrap(svgInner, w, h, legendHtml){
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${svgInner}</svg>${legendHtml||''}`;
}
function legendHtml(items){
  return `<div class="chart-legend">${items.map(i=>`<div class="li"><span class="dot" style="background:${i.color};"></span>${i.label}</div>`).join('')}</div>`;
}

/* ---- Line / area chart. series: [{label,color,data:[...]}] ---- */
function lineChartSVG(labels, series, opts){
  opts = opts||{};
  const W=760,H=230, padL=44, padR=14, padT=14, padB=28;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const allVals = series.flatMap(s=>s.data);
  const maxV = niceMax(Math.max(...allVals, 1));
  const minV = 0;
  const n = labels.length;
  const xAt = i => padL + (n<=1?0:(i/(n-1))*plotW);
  const yAt = v => padT + plotH - ((v-minV)/(maxV-minV||1))*plotH;
  let grid = '';
  const steps=4;
  for(let g=0; g<=steps; g++){
    const val = maxV*g/steps;
    const y = yAt(val);
    grid += svgEl('line',{x1:padL,y1:y.toFixed(1),x2:W-padR,y2:y.toFixed(1),stroke:'#f0f1f4','stroke-width':1});
    grid += `<text x="${padL-8}" y="${(y+3).toFixed(1)}" font-size="9.5" fill="#9aa3b2" text-anchor="end">${shortNum(val)}</text>`;
  }
  const showEvery = Math.max(1, Math.ceil(n/7));
  let xlabels='';
  labels.forEach((l,i)=>{ if(i%showEvery===0 || i===n-1){ xlabels += `<text x="${xAt(i).toFixed(1)}" y="${H-8}" font-size="9.5" fill="#9aa3b2" text-anchor="middle">${l}</text>`; } });
  let paths = '';
  series.forEach(s=>{
    const pts = s.data.map((v,i)=>`${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`);
    const linePath = 'M'+pts.join(' L');
    const areaPath = 'M'+xAt(0).toFixed(1)+','+(padT+plotH)+' L'+pts.join(' L')+' L'+xAt(n-1).toFixed(1)+','+(padT+plotH)+' Z';
    if(opts.area!==false) paths += svgEl('path',{d:areaPath, fill:s.color, 'fill-opacity':0.09, stroke:'none'});
    paths += svgEl('path',{d:linePath, fill:'none', stroke:s.color, 'stroke-width':2.5, 'stroke-linejoin':'round', 'stroke-linecap':'round'});
    s.data.forEach((v,i)=>{ if(n<=20) paths += svgEl('circle',{cx:xAt(i).toFixed(1), cy:yAt(v).toFixed(1), r:2.6, fill:s.color}); });
  });
  const inner = grid+xlabels+paths;
  const legend = series.length>1 ? legendHtml(series.map(s=>({label:s.label,color:s.color}))) : '';
  return chartWrap(inner, W, H, legend);
}

/* ---- Vertical bar chart. series: [{label,color,data:[...]}] grouped or stacked ---- */
function barChartSVG(labels, series, opts){
  opts = opts||{};
  const stacked = !!opts.stacked;
  const W=760,H=230, padL=44, padR=14, padT=14, padB=28;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const n = labels.length;
  let maxV;
  if(stacked){
    maxV = niceMax(Math.max(...labels.map((_,i)=>series.reduce((a,s)=>a+s.data[i],0)), 1));
  } else {
    maxV = niceMax(Math.max(...series.flatMap(s=>s.data), 1));
  }
  const yAt = v => padT + plotH - (v/maxV)*plotH;
  let grid='';
  const steps=4;
  for(let g=0; g<=steps; g++){
    const val = maxV*g/steps; const y = yAt(val);
    grid += svgEl('line',{x1:padL,y1:y.toFixed(1),x2:W-padR,y2:y.toFixed(1),stroke:'#f0f1f4','stroke-width':1});
    grid += `<text x="${padL-8}" y="${(y+3).toFixed(1)}" font-size="9.5" fill="#9aa3b2" text-anchor="end">${shortNum(val)}</text>`;
  }
  const groupW = plotW/n;
  const barGap = opts.gap!==undefined?opts.gap:0.35;
  const seriesCount = series.length;
  const barW = stacked ? groupW*(1-barGap) : (groupW*(1-barGap))/seriesCount;
  let bars='';
  let xlabels='';
  const showEvery = Math.max(1, Math.ceil(n/9));
  for(let i=0;i<n;i++){
    const gx = padL + i*groupW + groupW*barGap/2;
    if(i%showEvery===0 || i===n-1) xlabels += `<text x="${(padL+i*groupW+groupW/2).toFixed(1)}" y="${H-8}" font-size="9.5" fill="#9aa3b2" text-anchor="middle">${labels[i]}</text>`;
    if(stacked){
      let acc=0;
      series.forEach(s=>{
        const v = s.data[i];
        const y1 = yAt(acc+v), y2 = yAt(acc);
        bars += svgEl('rect',{x:gx.toFixed(1), y:y1.toFixed(1), width:barW.toFixed(1), height:Math.max(0,(y2-y1)).toFixed(1), fill:s.color, rx:2});
        acc += v;
      });
    } else {
      series.forEach((s,si)=>{
        const v = s.data[i];
        const x = gx + si*barW;
        const y = yAt(v);
        bars += svgEl('rect',{x:x.toFixed(1), y:y.toFixed(1), width:(barW*0.82).toFixed(1), height:(padT+plotH-y).toFixed(1), fill:s.color, rx:2});
      });
    }
  }
  const inner = grid+bars+xlabels;
  const legend = series.length>1 ? legendHtml(series.map(s=>({label:s.label,color:s.color}))) : '';
  return chartWrap(inner, W, H, legend);
}

/* ---- Horizontal bar chart. rows: [{label,value,color}] ---- */
function hbarChartSVG(rows, opts){
  opts = opts||{};
  const W=760, rowH=28, padL=140, padR=54, padT=6, padB=6;
  const H = rows.length*rowH+padT+padB;
  const plotW = W-padL-padR;
  const maxV = niceMax(Math.max(...rows.map(r=>Math.abs(r.value)),1));
  let inner='';
  rows.forEach((r,i)=>{
    const y = padT + i*rowH;
    const w = Math.abs(r.value)/maxV*plotW;
    inner += `<text x="${padL-10}" y="${(y+rowH/2+3.5).toFixed(1)}" font-size="11" fill="#374151" text-anchor="end">${r.label.length>18?r.label.slice(0,17)+'…':r.label}</text>`;
    inner += svgEl('rect',{x:padL, y:(y+5).toFixed(1), width:Math.max(2,w).toFixed(1), height:(rowH-10), fill:r.color, rx:4});
    inner += `<text x="${(padL+w+8).toFixed(1)}" y="${(y+rowH/2+3.5).toFixed(1)}" font-size="10.5" fill="#6b7280">${shortNum(r.value)}</text>`;
  });
  return chartWrap(inner, W, H);
}

/* ---- Donut chart. slices: [{label,value,color}] ---- */
function donutChartSVG(slices, opts){
  opts = opts||{};
  const W=280,H=230, cx=W/2, cy=100, rOuter=78, rInner=50;
  const total = slices.reduce((a,s)=>a+s.value,0) || 1;
  let angle = -Math.PI/2;
  let paths='';
  slices.forEach(s=>{
    const frac = s.value/total;
    const a0 = angle, a1 = angle + frac*Math.PI*2;
    angle = a1;
    if(frac<=0) return;
    const largeArc = (a1-a0) > Math.PI ? 1 : 0;
    const x0o=cx+rOuter*Math.cos(a0), y0o=cy+rOuter*Math.sin(a0);
    const x1o=cx+rOuter*Math.cos(a1), y1o=cy+rOuter*Math.sin(a1);
    const x1i=cx+rInner*Math.cos(a1), y1i=cy+rInner*Math.sin(a1);
    const x0i=cx+rInner*Math.cos(a0), y0i=cy+rInner*Math.sin(a0);
    const d = `M${x0o},${y0o} A${rOuter},${rOuter} 0 ${largeArc} 1 ${x1o},${y1o} L${x1i},${y1i} A${rInner},${rInner} 0 ${largeArc} 0 ${x0i},${y0i} Z`;
    paths += svgEl('path',{d, fill:s.color});
  });
  const centerLabel = opts.centerLabel || (total? total : '');
  const inner = paths + `<text x="${cx}" y="${cy-2}" font-size="18" font-weight="700" fill="#111827" text-anchor="middle" font-family="Space Grotesk">${shortNum(total)}</text>
    <text x="${cx}" y="${cy+16}" font-size="10" fill="#9aa3b2" text-anchor="middle">total</text>`;
  const legend = legendHtml(slices.map(s=>({label:s.label+' ('+s.value+')', color:s.color})));
  return chartWrap(inner, W, H, legend);
}

function mountChart(id, html){
  const el = document.getElementById(id);
  if(el) el.innerHTML = html;
}

function last14Days(){ const arr=[]; for(let i=13;i>=0;i--) arr.push(fmtDate(daysAgo(i))); return arr; }

function drawSalesTrend(){
  const days = last14Days();
  const data = days.map(d=> SALES.filter(s=>s.date===d).reduce((a,s)=>a+s.total,0));
  mountChart('chartSalesTrend', lineChartSVG(days.map(d=>d.slice(5)), [{label:'Sales', color:PALETTE.brand, data}]));
}
function drawFastSlow(){
  const agg = productSalesAgg();
  const fast = agg.slice(0,4);
  const slow = agg.slice().sort((a,b)=>a.unitsSold-b.unitsSold).slice(0,4);
  const rows = [
    ...fast.map(p=>({label:p.name, value:p.unitsSold, color:PALETTE.teal})),
    ...slow.map(p=>({label:p.name, value:p.unitsSold, color:PALETTE.red})),
  ];
  mountChart('chartFastSlow', hbarChartSVG(rows) + legendHtml([{label:'Fast movers',color:PALETTE.teal},{label:'Slow movers',color:PALETTE.red}]));
}
function drawTopProducts(){
  const top = productSalesAgg().slice(0,6);
  const rows = top.map(p=>({label:p.name, value:p.revenue, color:PALETTE.violet}));
  mountChart('chartTopProducts', hbarChartSVG(rows));
}
function drawStockMovement(){
  const days = last14Days();
  const inData = days.map(d=> STOCK_MOVEMENTS.filter(m=>m.date===d&&m.type==='in').reduce((a,m)=>a+m.qty,0));
  const outData = days.map(d=> STOCK_MOVEMENTS.filter(m=>m.date===d&&m.type==='out').reduce((a,m)=>a+m.qty,0));
  mountChart('chartStockMovement', barChartSVG(days.map(d=>d.slice(5)), [
    {label:'Stock In', color:PALETTE.teal, data:inData},
    {label:'Stock Out', color:PALETTE.red, data:outData},
  ]));
}
function drawAttendanceChart(){
  const dates = Object.keys(ATTENDANCE).sort();
  const present = dates.map(d=>Object.values(ATTENDANCE[d]).filter(s=>s==='Present').length);
  const late = dates.map(d=>Object.values(ATTENDANCE[d]).filter(s=>s==='Late').length);
  const absent = dates.map(d=>Object.values(ATTENDANCE[d]).filter(s=>s==='Absent').length);
  mountChart('chartAttendance', barChartSVG(dates.map(d=>d.slice(8)), [
    {label:'Present', color:PALETTE.teal, data:present},
    {label:'Late', color:PALETTE.amber, data:late},
    {label:'Absent', color:PALETTE.red, data:absent},
  ], {stacked:true}));
}
function drawRevCost(){
  const days = last14Days();
  const rev = days.map(d=> SALES.filter(s=>s.date===d).reduce((a,s)=>a+s.taxable,0));
  const cost = days.map(d=> SALES.filter(s=>s.date===d).reduce((a,s)=>a+s.items.reduce((x,it)=>{const p=PRODUCTS.find(pp=>pp.id===it.productId); return x+(p?p.cost*it.qty:0);},0),0));
  mountChart('chartRevCost', lineChartSVG(days.map(d=>d.slice(5)), [
    {label:'Revenue (excl. VAT)', color:PALETTE.brand, data:rev},
    {label:'Cost', color:PALETTE.red, data:cost},
  ]));
}
function drawProfitTrend(){
  const days = last14Days();
  const profit = days.map(d=>{
    const s = SALES.filter(x=>x.date===d);
    const rev = s.reduce((a,x)=>a+x.taxable,0);
    const cost = s.reduce((a,x)=>a+x.items.reduce((y,it)=>{const p=PRODUCTS.find(pp=>pp.id===it.productId); return y+(p?p.cost*it.qty:0);},0),0);
    return rev-cost;
  });
  mountChart('chartProfitTrend', lineChartSVG(days.map(d=>d.slice(5)), [{label:'Profit', color:PALETTE.teal, data:profit}]));
}
function drawWeeklySales(){
  const weeks = [];
  for(let w=5; w>=0; w--){
    let sum=0;
    for(let d=w*7; d<w*7+7; d++){ sum += salesOn(fmtDate(daysAgo(d))).reduce((a,s)=>a+s.total,0); }
    weeks.push(sum);
  }
  mountChart('chartWeeklySales', barChartSVG(['Wk -5','Wk -4','Wk -3','Wk -2','Wk -1','This Wk'], [{label:'Sales', color:PALETTE.brand, data:weeks}]));
}
function drawMonthlySales(){
  const months = ['Apr','May','Jun','Jul','Aug','Sep'];
  const base = monthSales().reduce((a,s)=>a+s.total,0) || 800000;
  const data = months.map((m,i)=> Math.round(base*(0.65+i*0.09)*(0.9+((i*37)%20)/100)));
  mountChart('chartMonthlySales', barChartSVG(months, [{label:'Sales', color:PALETTE.violet, data}]));
}
function drawInvoiceStatus(){
  const paid = INVOICES.filter(i=>i.status==='Paid').length;
  const pending = INVOICES.filter(i=>i.status==='Pending').length;
  const partial = INVOICES.filter(i=>i.status==='Partially Paid').length;
  mountChart('chartInvoiceStatus', donutChartSVG([
    {label:'Paid', value:paid, color:PALETTE.teal},
    {label:'Partially Paid', value:partial, color:PALETTE.brand},
    {label:'Pending', value:pending, color:PALETTE.amber},
  ]));
}
function drawCategoryStock(){
  const byCat = {};
  PRODUCTS.forEach(p=>{ byCat[p.category] = (byCat[p.category]||0) + p.stock*p.cost; });
  const colors = [PALETTE.brand, PALETTE.teal, PALETTE.amber, PALETTE.violet, PALETTE.red, PALETTE.navy];
  mountChart('chartCategoryStock', donutChartSVG(Object.entries(byCat).map(([k,v],i)=>({label:k, value:v, color:colors[i%colors.length]}))));
}

/* ============================= PAGINATION HELPERS ============================= */
function getPage(filterKey){ return state.filters[filterKey]||1; }
function paginateList(list, filterKey, perPage){
  const totalPages = Math.max(1, Math.ceil(list.length/perPage));
  let page = getPage(filterKey);
  if(page>totalPages) page = totalPages;
  if(page<1) page = 1;
  state.filters[filterKey] = page;
  return { paged: list.slice((page-1)*perPage, page*perPage), page, totalPages };
}
function paginationBar(filterKey, page, totalPages, pageName, totalCount, perPage){
  if(totalPages<=1) return '';
  const maxBtns=5;
  let start=Math.max(1,page-2), end=Math.min(totalPages,start+maxBtns-1);
  start=Math.max(1,end-maxBtns+1);
  let nums='';
  for(let n=start;n<=end;n++) nums+=`<div class="page-btn ${n===page?'active':''}" onclick="state.filters.${filterKey}=${n};quickRerender('${pageName}')">${n}</div>`;
  const rangeStart = totalCount? (page-1)*perPage+1 : 0;
  const rangeEnd = Math.min(totalCount, page*perPage);
  return `<div class="pagination">
    <div class="cell-sub">Showing ${rangeStart}–${rangeEnd} of ${totalCount}</div>
    <div class="page-btns">
      <div class="page-btn" style="${page<=1?'opacity:.4;pointer-events:none;':''}" onclick="state.filters.${filterKey}=${page-1};quickRerender('${pageName}')">${ic('chevronLeft')}</div>
      ${nums}
      <div class="page-btn" style="${page>=totalPages?'opacity:.4;pointer-events:none;':''}" onclick="state.filters.${filterKey}=${page+1};quickRerender('${pageName}')">${ic('chevronRight')}</div>
    </div>
  </div>`;
}

/* ============================= CREATE SALE ============================= */
function cartSubtotal(){ return state.saleCart.reduce((a,i)=>a+i.qty*i.price,0); }
function cartTaxable(){ return Math.max(0, cartSubtotal() - (state.saleDiscount||0)); }
function cartVat(){ return Math.round(cartTaxable()*VAT_RATE); }
function cartTotal(){ return cartTaxable() + cartVat(); }
function addToCart(productId){
  const p = PRODUCTS.find(x=>x.id===productId);
  if(!p || p.stock<=0){ toast('error','This product is out of stock.'); return; }
  const existing = state.saleCart.find(i=>i.productId===productId);
  if(existing){
    if(existing.qty>=p.stock){ toast('error','Not enough stock available.'); return; }
    existing.qty++;
  } else {
    state.saleCart.push({productId, name:p.name, price:p.price, qty:1});
  }
  render();
}
function changeCartQty(productId, delta){
  const item = state.saleCart.find(i=>i.productId===productId);
  const p = PRODUCTS.find(x=>x.id===productId);
  if(!item) return;
  item.qty += delta;
  if(item.qty<=0){ state.saleCart = state.saleCart.filter(i=>i.productId!==productId); }
  else if(p && item.qty>p.stock){ item.qty = p.stock; toast('error','Reached available stock limit.'); }
  render();
}
function removeFromCart(productId){ state.saleCart = state.saleCart.filter(i=>i.productId!==productId); render(); }
function clearCart(){ state.saleCart=[]; state.saleDiscount=0; state.saleCustomer=''; render(); }

function completeSale(){
  if(state.saleCart.length===0) return;
  for(const item of state.saleCart){
    const p = PRODUCTS.find(x=>x.id===item.productId);
    if(!p || item.qty>p.stock){ toast('error',`Insufficient stock for ${item.name}`); return; }
  }
  const items = state.saleCart.map(i=>({productId:i.productId, name:i.name, qty:i.qty, price:i.price, total:i.qty*i.price}));
  const subtotal = items.reduce((a,i)=>a+i.total,0);
  const discount = Math.min(state.saleDiscount||0, subtotal);
  const taxable = subtotal-discount;
  const vat = Math.round(taxable*VAT_RATE);
  const total = taxable+vat;
  items.forEach(i=>{
    const p = PRODUCTS.find(x=>x.id===i.productId);
    p.stock -= i.qty; recalcProductStatus(p);
    pushMovement('out', p, i.qty, {reason:'Sale', notes:'POS transaction'}, new Date());
  });
  const invNo = 'INV-'+String(2026000+invCounter).slice(-4); invCounter++;
  const saleId = 'TXN'+(9000+idc++);
  const custName = state.saleCustomer||'Walk-in Customer';
  const sale = { id:saleId, date:fmtDate(new Date()), items, subtotal, discount, taxable, vat, total, method:state.saleMethod,
    customer: custName, payStatus:'Paid', cashier: state.user.name, invoiceNo:invNo };
  SALES.unshift(sale);
  INVOICES.unshift({ invoiceNo:invNo, saleId, date:sale.date, customer:sale.customer, phone:'+265 99'+Math.floor(1000000+Math.random()*8999999),
    items, subtotal, discount, taxable, vat, total, status:'Paid', type:'Sale' });
  logAudit('Completed Sale', `Sold ${items.length} item(s) to ${custName} — ${invNo} (${money(total)})`);
  clearCart();
  toast('success', `Sale completed — ${invNo} generated`);
  openModal('viewInvoice',{invoiceNo:invNo});
}

function renderAttendance(){
  const date = state.filters.attDate || todayStr();

  const present = Object.values(dayData).filter(s=>s==='Present').length;

  const tab = state.filters.attTab || 'daily';
  return `

    <div class="tab ${tab==='monthly'?'active':''}" onclick="state.filters.attTab='monthly';quickRerender('attendance')">Monthly Report</div>
  </div>
  ${tab==='daily' ? `
  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="field"><label>Select Date</label><input class="input" type="date" value="${date}" onchange="state.filters.attDate=this.value;quickRerender('attendance')"/></div>
      </div>
      <div style="display:flex;gap:8px;">
        <span class="badge badge-green">${present} Present</span>
        <span class="badge badge-amber">${late} Late</span>
        <span class="badge badge-red">${absent} Absent</span>
        <span class="badge badge-violet">${leave} Leave</span>
      </div>
    </div>
    <div class="table-wrap"><table class="data-table">
      <thead><tr><th>Employee</th><th>Department</th><th>Status</th></tr></thead>
      <tbody>
      ${EMPLOYEES.map(e=>{
        const st = dayData[e.id] || 'Present';
        return `<tr>
          <td><div style="display:flex;align-items:center;gap:8px;"><div class="avatar" style="width:24px;height:24px;font-size:9.5px;">${initials(e.name)}</div>${e.name}</div></td>
          <td>${e.department}</td>
          <td>
            <div style="display:flex;gap:6px;">
            ${['Present','Late','Absent','Leave'].map(s=>`<button class="badge ${st===s?statusBadgeClass(s):'badge-gray'}" style="border:none;cursor:pointer;" onclick="setAttendance('${date}','${e.id}','${s}')">${s}</button>`).join('')}
            </div>
          </td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>
  </div>` : `
  <div class="card">
    <div class="toolbar"><div class="card-title">Monthly Attendance — ${new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'})}</div>
      <button class="btn btn-outline btn-sm" onclick="window.print()">${ic('print')}Print Report</button>
    </div>
    <div class="table-wrap"><table class="data-table">
      <thead><tr><th>Employee</th><th>Working Days</th><th>Present</th><th>Absent</th><th>Late</th><th>Leave</th><th>Attendance %</th></tr></thead>
      <tbody>
      ${EMPLOYEES.map(e=>{
        let wd=0,p=0,a=0,l=0,lv=0;
        Object.values(ATTENDANCE).forEach(day=>{
          if(day[e.id]){ wd++; const s=day[e.id]; if(s==='Present')p++; else if(s==='Absent')a++; else if(s==='Late')l++; else if(s==='Leave')lv++; }
        });
        const pct = wd? Math.round((p+l)/wd*100):0;
        return `<tr><td class="cell-strong">${e.name}</td><td>${wd}</td><td>${p}</td><td>${a}</td><td>${l}</td><td>${lv}</td>
          <td><span class="badge ${pct>=90?'badge-green':pct>=75?'badge-amber':'badge-red'}">${pct}%</span></td></tr>`;
      }).join('')}
      </tbody>
    </table></div>
  </div>`}
  `;
}
function statusBadgeClass(s){ return {'Present':'badge-green','Late':'badge-amber','Absent':'badge-red','Leave':'badge-violet'}[s]; }
function setAttendance(date, empId, status){
  if(!ATTENDANCE[date]) ATTENDANCE[date]={};
  const prev = ATTENDANCE[date][empId];
  ATTENDANCE[date][empId]=status;
  if(prev!==status){
    const emp = EMPLOYEES.find(e=>e.id===empId);
    logAudit('Marked Attendance', `Set ${emp?emp.name:empId} as ${status} for ${fmtDateLong(date)}`);
  }
  render();
}

  const grossProfit = revenue-cogs;
  const txCount = mSales.length;
  const avgSale = txCount? Math.round(revenue/txCount) : 0;
  const agg = productSalesAgg();

  return `

      <div id="chartMonthlySales" class="chart-box" style="height:120px;"></div>

    <div class="card">
      <div class="card-head"><div class="card-title">Best Selling Products</div></div>
      ${best.map(p=>`<div class="stat-row"><span class="cell-strong" style="font-size:12.5px;">${p.name}</span><span>${money(p.revenue)}</span></div>`).join('')}

function renderReportBody(tab){
  const chartBox = `<div id="chartReportMain" class="chart-box" style="height:220px;margin-bottom:20px;"></div>`;
  switch(tab){
    case 'sales': {
      const {paged, page, totalPages} = paginateList(SALES, 'reportPage', 10);
      return chartBox + `<div class="table-wrap"><table class="data-table"><thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th></tr></thead><tbody>
      ${paged.map(s=>`<tr><td class="cell-strong">${s.invoiceNo}</td><td>${s.customer}</td><td class="cell-sub">${fmtDateLong(s.date)}</td><td>${money(s.total)}</td><td>${statusBadge(s.payStatus)}</td></tr>`).join('')}
      </tbody></table></div>${paginationBar('reportPage', page, totalPages, 'reports', SALES.length, 10)}`;
    }
    case 'inventory': {
      const {paged, page, totalPages} = paginateList(PRODUCTS, 'reportPage', 10);
      return chartBox + `<div class="table-wrap"><table class="data-table"><thead><tr><th>Product</th><th>Category</th><th>Stock</th><th>Stock Value</th><th>Status</th></tr></thead><tbody>
      ${paged.map(p=>`<tr><td class="cell-strong">${p.name}</td><td>${p.category}</td><td>${p.stock}</td><td>${money(p.stock*p.cost)}</td><td>${statusBadge(p.status)}</td></tr>`).join('')}
      </tbody></table></div>${paginationBar('reportPage', page, totalPages, 'reports', PRODUCTS.length, 10)}`;
    }
    case 'stockmove': {
      const sorted = STOCK_MOVEMENTS.slice().reverse();
      const {paged, page, totalPages} = paginateList(sorted, 'reportPage', 10);
      return chartBox + `<div class="table-wrap"><table class="data-table"><thead><tr><th>Ref</th><th>Type</th><th>Product</th><th>Qty</th><th>Date</th></tr></thead><tbody>
      ${paged.map(m=>`<tr><td class="cell-strong">${m.ref}</td><td>${statusBadge(m.type==='in'?'Present':'Absent').replace('Present','Stock In').replace('Absent','Stock Out')}</td><td>${m.productName}</td><td>${m.qty}</td><td class="cell-sub">${fmtDateLong(m.date)}</td></tr>`).join('')}
      </tbody></table></div>${paginationBar('reportPage', page, totalPages, 'reports', sorted.length, 10)}`;
    }
    case 'fastmove': return chartBox + renderMiniProductList(productSalesAgg().slice(0,10));
    case 'slowmove': return chartBox + renderMiniProductList(productSalesAgg().slice().sort((a,b)=>a.unitsSold-b.unitsSold).slice(0,10));
    case 'attendance': return chartBox + `<div class="table-wrap"><table class="data-table"><thead><tr><th>Employee</th><th>Present</th><th>Absent</th><th>Attendance %</th></tr></thead><tbody>
      ${EMPLOYEES.map(e=>{let p=0,tot=0;Object.values(ATTENDANCE).forEach(d=>{if(d[e.id]){tot++; if(d[e.id]==='Present'||d[e.id]==='Late')p++;}});
      const a=tot-p; const pct=tot?Math.round(p/tot*100):0;

}
function drawReportChart(tab){
  switch(tab){
    case 'sales': {
      const days = last14Days();
      const data = days.map(d=> SALES.filter(s=>s.date===d).reduce((a,s)=>a+s.total,0));
      mountChart('chartReportMain', lineChartSVG(days.map(d=>d.slice(5)), [{label:'Sales', color:PALETTE.brand, data}]));
      break;
    }
    case 'inventory': {
      const byCat = {};
      PRODUCTS.forEach(p=>{ byCat[p.category] = (byCat[p.category]||0) + p.stock*p.cost; });
      const colors = [PALETTE.brand, PALETTE.teal, PALETTE.amber, PALETTE.violet, PALETTE.red, PALETTE.navy];
      mountChart('chartReportMain', donutChartSVG(Object.entries(byCat).map(([k,v],i)=>({label:k, value:v, color:colors[i%colors.length]}))));
      break;
    }
    case 'stockmove': {
      const days = last14Days();
      const inData = days.map(d=> STOCK_MOVEMENTS.filter(m=>m.date===d&&m.type==='in').reduce((a,m)=>a+m.qty,0));
      const outData = days.map(d=> STOCK_MOVEMENTS.filter(m=>m.date===d&&m.type==='out').reduce((a,m)=>a+m.qty,0));
      mountChart('chartReportMain', barChartSVG(days.map(d=>d.slice(5)), [
        {label:'Stock In', color:PALETTE.teal, data:inData}, {label:'Stock Out', color:PALETTE.red, data:outData},
      ]));
      break;
    }
    case 'fastmove': {
      const rows = productSalesAgg().slice(0,8).map(p=>({label:p.name, value:p.unitsSold, color:PALETTE.teal}));
      mountChart('chartReportMain', hbarChartSVG(rows));
      break;
    }
    case 'slowmove': {
      const rows = productSalesAgg().slice().sort((a,b)=>a.unitsSold-b.unitsSold).slice(0,8).map(p=>({label:p.name, value:p.unitsSold, color:PALETTE.red}));
      mountChart('chartReportMain', hbarChartSVG(rows));
      break;
    }
    case 'attendance': case 'empperf': {
      const dates = Object.keys(ATTENDANCE).sort();
      const present = dates.map(d=>Object.values(ATTENDANCE[d]).filter(s=>s==='Present').length);
      const late = dates.map(d=>Object.values(ATTENDANCE[d]).filter(s=>s==='Late').length);
      const absent = dates.map(d=>Object.values(ATTENDANCE[d]).filter(s=>s==='Absent').length);
      mountChart('chartReportMain', barChartSVG(dates.map(d=>d.slice(8)), [
        {label:'Present', color:PALETTE.teal, data:present}, {label:'Late', color:PALETTE.amber, data:late}, {label:'Absent', color:PALETTE.red, data:absent},
      ], {stacked:true}));
      break;
    }
    case 'invoice': {
      const paid = INVOICES.filter(i=>i.status==='Paid').length;
      const pending = INVOICES.filter(i=>i.status==='Pending').length;
      const partial = INVOICES.filter(i=>i.status==='Partially Paid').length;
      mountChart('chartReportMain', donutChartSVG([
        {label:'Paid', value:paid, color:PALETTE.teal}, {label:'Partially Paid', value:partial, color:PALETTE.brand}, {label:'Pending', value:pending, color:PALETTE.amber},
      ]));
      break;
    }
    case 'performance': {
      const days = last14Days();
      const rev = days.map(d=> SALES.filter(s=>s.date===d).reduce((a,s)=>a+s.taxable,0));
      const profit = days.map((d,i)=>{
        const s = SALES.filter(x=>x.date===d);
        const cost = s.reduce((a,x)=>a+x.items.reduce((y,it)=>{const p=PRODUCTS.find(pp=>pp.id===it.productId); return y+(p?p.cost*it.qty:0);},0),0);
        return rev[i]-cost;
      });
      mountChart('chartReportMain', lineChartSVG(days.map(d=>d.slice(5)), [
        {label:'Net Revenue', color:PALETTE.brand, data:rev}, {label:'Profit', color:PALETTE.teal, data:profit},
      ]));
      break;
    }
  }
}

function saveProduct(id){
  const name = document.getElementById('pfName').value.trim();
  if(!name){ toast('error','Product name is required.'); return; }
  const data = {
    name, sku: document.getElementById('pfSku').value,
    category: document.getElementById('pfCat').value,
    cost: Number(document.getElementById('pfCost').value)||0,
    price: Number(document.getElementById('pfPrice').value)||0,
    stock: Number(document.getElementById('pfStock').value)||0,
    min: Number(document.getElementById('pfMin').value)||0,
  };
  if(id){
    const p = PRODUCTS.find(x=>x.id===id);
    Object.assign(p, data); recalcProductStatus(p);
    logAudit('Updated Product', `Edited ${p.name} (${p.sku})`);
    toast('success','Product updated');
  } else {
    const np = Object.assign({id:'P'+(2000+PRODUCTS.length), createdAt:fmtDate(new Date())}, data);
    recalcProductStatus(np);
    PRODUCTS.unshift(np);
    logAudit('Added Product', `Created new product ${np.name} (${np.sku})`);
    toast('success','Product added');
  }
  closeModal();
}
function deleteProduct(id){
  const p = PRODUCTS.find(x=>x.id===id);

  toast('success','Product deleted');

}

function addToQuoteCart(productId){
  const p = PRODUCTS.find(x=>x.id===productId);
  if(!p) return;
  const existing = state.quoteCart.find(i=>i.productId===productId);
  if(existing) existing.qty++;
  else state.quoteCart.push({productId, name:p.name, price:p.price, qty:1});
  render();
}
function changeQuoteQty(productId, delta){
  const item = state.quoteCart.find(i=>i.productId===productId);
  if(!item) return;
  item.qty += delta;
  if(item.qty<=0) state.quoteCart = state.quoteCart.filter(i=>i.productId!==productId);
  render();
}
function removeFromQuoteCart(productId){ state.quoteCart = state.quoteCart.filter(i=>i.productId!==productId); render(); }

function generateStandaloneInvoice(){
  if(state.quoteCart.length===0){ toast('error','Add at least one product before generating the invoice.'); return; }
  const custName = (state.quoteCustomer||'').trim() || 'Walk-in Customer';
  const custPhone = (state.quotePhone||'').trim() || '—';
  const items = state.quoteCart.map(i=>({productId:i.productId, name:i.name, qty:i.qty, price:i.price, total:i.qty*i.price}));
  const subtotal = items.reduce((a,i)=>a+i.total,0);
  const discount = Math.min(state.quoteDiscount||0, subtotal);
  const taxable = Math.max(0, subtotal-discount);
  const vat = Math.round(taxable*VAT_RATE);
  const total = taxable+vat;
  const invNo = 'INV-'+String(2026000+invCounter).slice(-4); invCounter++;
  INVOICES.unshift({
    invoiceNo:invNo, saleId:null, date:fmtDate(new Date()), customer:custName, phone:custPhone,
    items, subtotal, discount, taxable, vat, total, status:'Pending', type:'Quote',
  });
  logAudit('Created Invoice', `Generated invoice-only bill ${invNo} for ${custName} (${money(total)}) — no sale or stock change`);
  state.quoteCart=[]; state.quoteCustomer=''; state.quotePhone=''; state.quoteDiscount=0;
  toast('success', `${invNo} generated — ready to print or download`);
  openModal('viewInvoice',{invoiceNo:invNo});
}

}

  const x=QUOTES.find(q=>q.no===no);
  state.dn={orderId:null,customer:x.customer,phone:x.phone,address:'',ref:x.no,driver:'',lines:x.lines.map(l=>({productId:l.productId,name:l.name,ordered:l.qty,before:0,supply:null}))};
  openModal('deliver');
}

/* ---------- DEBTORS & CREDITORS ---------- */
const ldBal = e => e.amount-e.paid;
const ldStatus = e => ldBal(e)<=0?'Settled':(e.due<todayStr()?'Overdue':(e.paid>0?'Part Paid':'Outstanding'));
function renderLedger(kind){
  const D=kind==='debtors', list=LEDGER[kind], tot=list.reduce((a,e)=>a+ldBal(e),0), od=list.filter(e=>ldStatus(e)==='Overdue');
  const q=(state.tableSearch[kind]||'').toLowerCase();
  const rows=list.filter(e=>!q||e.party.toLowerCase().includes(q));
  return `<div class="grid grid-3" style="margin-bottom:16px;">
   ${kpiCard(D?'arrowDownCircle':'arrowUpCircle',D?'var(--teal)':'var(--amber)',D?'var(--teal-soft)':'var(--amber-soft)',D?'Total Owed To Us':'Total We Owe',money(tot),null,D)}
   ${kpiCard('alert','var(--red)','var(--red-soft)','Overdue',od.length+' · '+money(od.reduce((a,e)=>a+ldBal(e),0)),null,false)}
   ${kpiCard('users','var(--brand-dark)','var(--blue-soft)',D?'Debtors':'Creditors',new Set(list.filter(e=>ldBal(e)>0).map(e=>e.party)).size,null,true)}</div>
  <div class="card"><div class="toolbar"><div class="toolbar-left"><input class="filter-input" style="width:240px;" placeholder="Search name..." value="${state.tableSearch[kind]||''}" oninput="state.tableSearch.${kind}=this.value;quickRerender('${kind}')"/></div></div>
  <div class="table-wrap"><table class="data-table"><thead><tr><th>${D?'Debtor':'Creditor'}</th><th>Reference</th><th>Due</th><th>Amount</th><th>Paid</th><th>Balance</th><th>Status</th><th></th></tr></thead><tbody>
  ${rows.map(e=>`<tr><td class="cell-strong">${e.party}<div class="cell-sub">${e.phone||''}</div></td><td>${e.ref||'—'}</td><td class="cell-sub">${e.due}</td><td>${money(e.amount)}</td><td>${money(e.paid)}</td><td class="cell-strong">${money(ldBal(e))}</td><td>${stBadge(ldStatus(e))}</td>
   <td style="white-space:nowrap;">${ldBal(e)>0?`<button class="btn btn-primary btn-sm" onclick="openModal('payLedger',{kind:'${kind}',id:'${e.id}'})">${D?'Receive':'Pay'}</button> `:''}<button class="btn btn-outline btn-sm" onclick="openModal('histLedger',{kind:'${kind}',id:'${e.id}'})">History</button></td></tr>`).join('')||`<tr><td colspan="8"><div class="empty-state"><div class="et">No records</div></div></td></tr>`}
  </tbody></table></div></div>`;
}
function ledgerForm(kind){
  const D=kind==='debtors';
  return `<div class="grid grid-2"><div class="field" style="grid-column:1/-1;"><label>${D?'Debtor (who owes us)':'Creditor (who we owe)'}</label>${D?`<input class="input" id="lfParty" list="lfList" placeholder="Name"/><datalist id="lfList">${CUSTOMERS.map(c=>`<option value="${c}">`).join('')}</datalist>`:`<input class="input" id="lfParty" list="lfList" placeholder="Supplier name"/><datalist id="lfList">${SUPPLIERS.map(c=>`<option value="${c}">`).join('')}</datalist>`}</div>
   <div class="field"><label>Phone</label><input class="input" id="lfPhone"/></div><div class="field"><label>Reference</label><input class="input" id="lfRef" placeholder="Invoice / description"/></div>
   <div class="field"><label>Amount (MK)</label><input class="input" type="number" id="lfAmt"/></div><div class="field"><label>Already Paid (MK)</label><input class="input" type="number" id="lfPaid" value="0"/></div>
   <div class="field"><label>Date</label><input class="input" type="date" id="lfDate" value="${todayStr()}"/></div><div class="field"><label>Due Date</label><input class="input" type="date" id="lfDue" value="${addDays(30)}"/></div></div>
   <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveLedger('${kind}')">${ic('check')}Save</button></div>`;
}
function saveLedger(kind){
  const party=(v('lfParty')||'').trim(), amount=Number(v('lfAmt'))||0, paid=Math.min(Number(v('lfPaid'))||0,amount);
  if(!party||amount<=0){ toast('error','Enter a name and an amount.'); return; }
  LEDGER[kind].push({id:(kind==='debtors'?'D':'C')+ldSeq++,party,phone:v('lfPhone'),ref:v('lfRef'),amount,paid,date:v('lfDate'),due:v('lfDue'),notes:'',payments:paid?[{date:v('lfDate'),amt:paid}]:[]});
  logAudit(kind==='debtors'?'Added Debtor':'Added Creditor',`${party} — ${money(amount)}`); toast('success','Record saved'); closeModal();
}
function payForm(p){
  const e=LEDGER[p.kind].find(x=>x.id===p.id), D=p.kind==='debtors';
  return `<div class="cell-strong">${e.party}</div><div class="cell-sub" style="margin-bottom:12px;">Balance: ${money(ldBal(e))}</div>
  <div class="grid grid-2"><div class="field"><label>${D?'Amount Received':'Amount Paid'} (MK)</label><input class="input" type="number" id="plAmt" value="${ldBal(e)}"/></div><div class="field"><label>Date</label><input class="input" type="date" id="plDate" value="${todayStr()}"/></div></div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="savePay('${p.kind}','${p.id}')">${ic('check')}Record</button></div>`;
}
function savePay(kind,id){
  const e=LEDGER[kind].find(x=>x.id===id), amt=Number(v('plAmt'))||0;
  if(amt<=0||amt>ldBal(e)){ toast('error','Amount must be between 1 and the balance.'); return; }
  e.paid+=amt; e.payments.push({date:v('plDate'),amt});
  logAudit(kind==='debtors'?'Received Payment':'Made Payment',`${e.party} — ${money(amt)}`); toast('success','Payment recorded'); closeModal();
}
function histView(p){
  const e=LEDGER[p.kind].find(x=>x.id===p.id);
  return `<div class="cell-strong">${e.party}</div><div class="cell-sub" style="margin-bottom:10px;">${e.ref||''} · Total ${money(e.amount)} · Balance ${money(ldBal(e))}</div>
  <table class="data-table"><thead><tr><th>Date</th><th>Amount</th></tr></thead><tbody>${e.payments.map(x=>`<tr><td>${x.date}</td><td>${money(x.amt)}</td></tr>`).join('')||'<tr><td colspan="2" class="cell-sub">No payments yet.</td></tr>'}</tbody></table>`;
}

/* ---------- DELIVERY NOTES ---------- */
function renderDeliveries(){
  const open=ORDERS.filter(o=>o.lines.some(l=>l.ordered>l.delivered));
  return `<div class="grid grid-3" style="margin-bottom:16px;">
   ${kpiCard('package','var(--brand-dark)','var(--blue-soft)','Delivery Notes',DELIVERIES.length,null,true)}
   ${kpiCard('clock','var(--amber)','var(--amber-soft)','Orders With Balance',open.length,null,false)}
   ${kpiCard('checkCircle','var(--teal)','var(--teal-soft)','Completed Orders',ORDERS.length-open.length,null,true)}</div>
  <div class="card" style="margin-bottom:16px;"><div class="card-head"><div class="card-title">Orders Waiting For Balance</div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Order</th><th>Customer</th><th>Still To Deliver</th><th></th></tr></thead><tbody>
  ${open.map(o=>`<tr><td class="cell-strong">${o.id}</td><td>${o.customer}</td><td>${o.lines.filter(l=>l.ordered>l.delivered).map(l=>`${l.ordered-l.delivered} × ${l.name}`).join(', ')}</td><td><button class="btn btn-primary btn-sm" onclick="deliverBalance('${o.id}')">Deliver Balance</button></td></tr>`).join('')||'<tr><td colspan="4"><div class="empty-state" style="padding:20px;"><div class="et">No outstanding balances</div></div></td></tr>'}</tbody></table></div></div>
  <div class="card"><div class="card-head"><div class="card-title">All Delivery Notes</div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Note No</th><th>Date</th><th>Customer</th><th>Order</th><th>Status</th><th></th></tr></thead><tbody>
  ${DELIVERIES.slice().reverse().map(d=>`<tr><td class="cell-strong">${d.no}</td><td class="cell-sub">${d.date}</td><td>${d.customer}</td><td>${d.orderId}</td><td>${d.lines.some(l=>l.balance>0)?stBadge('Partly Delivered'):stBadge('Completed')}</td><td><button class="btn btn-outline btn-sm" onclick="openModal('viewDN',{no:'${d.no}'})">View</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty-state"><div class="et">No delivery notes yet</div><div class="ed">Create one when goods leave for a customer.</div></div></td></tr>'}</tbody></table></div></div>`;
}
function newDelivery(){ state.dn={orderId:null,customer:'',phone:'',address:'',ref:'',driver:'',lines:[]}; openModal('deliver'); }
function deliverBalance(id){
  const o=ORDERS.find(x=>x.id===id);
  state.dn={orderId:id,customer:o.customer,phone:o.phone,address:o.address,ref:o.ref,driver:'',lines:o.lines.filter(l=>l.ordered>l.delivered).map(l=>({productId:l.productId,name:l.name,ordered:l.ordered,before:l.delivered,supply:null}))};
  openModal('deliver');
}
const dnAvail = l => { const p=PRODUCTS.find(x=>x.id===l.productId); const stock=p?p.stock:0; return Math.max(0,Math.min(l.ordered-l.before,stock)); };
const dnSupply = l => l.supply==null?dnAvail(l):Math.min(l.supply,dnAvail(l));
function deliverForm(){
  const f=state.dn, fresh=!f.orderId;
  return `<div class="grid grid-2">
   <div class="field"><label>Customer</label><input class="input" value="${f.customer}" ${fresh?'':'disabled'} oninput="state.dn.customer=this.value"/></div>
   <div class="field"><label>Phone</label><input class="input" value="${f.phone||''}" ${fresh?'':'disabled'} oninput="state.dn.phone=this.value"/></div>
   <div class="field"><label>Delivery Address</label><input class="input" value="${f.address||''}" ${fresh?'':'disabled'} oninput="state.dn.address=this.value"/></div>
   <div class="field"><label>Reference (PO / Quote)</label><input class="input" value="${f.ref||''}" ${fresh?'':'disabled'} oninput="state.dn.ref=this.value"/></div>
   <div class="field"><label>Driver / Vehicle</label><input class="input" value="${f.driver||''}" oninput="state.dn.driver=this.value"/></div></div>
  ${fresh?`<div class="field" style="margin-top:12px;"><label>Add Ordered Item</label><div style="display:flex;gap:8px;"><select class="input" id="dnProd">${PRODUCTS.map(p=>`<option value="${p.id}">${p.name} (stock: ${p.stock})</option>`).join('')}</select><input class="input" type="number" id="dnQty" placeholder="Qty ordered" style="width:130px;"/><button class="btn btn-primary" onclick="dnAdd()">${ic('plus')}Add</button></div></div>`:''}
  <table class="data-table" style="margin-top:10px;"><thead><tr><th>Item</th><th>Ordered</th><th>Delivered Before</th><th>In Stock</th><th>Supply Now</th><th>Balance After</th></tr></thead><tbody>
  ${f.lines.map((l,i)=>{const p=PRODUCTS.find(x=>x.id===l.productId),s=dnSupply(l);return `<tr><td>${l.name}</td><td>${l.ordered}</td><td>${l.before}</td><td>${p.stock}</td><td><input class="input" type="number" min="0" style="width:80px" value="${s}" onchange="state.dn.lines[${i}].supply=Math.max(0,Number(this.value)||0);render()"/></td><td class="cell-strong">${l.ordered-l.before-s}</td></tr>`}).join('')||'<tr><td colspan="6" class="cell-sub">Add the items the customer ordered.</td></tr>'}</tbody></table>
  <div class="cell-sub" style="margin-top:8px;">Supply Now defaults to what is in stock (never more than the customer still needs). Anything left over is saved as a balance to deliver later.</div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveDelivery()">${ic('check')}Create Delivery Note</button></div>`;
}
function dnAdd(){
  const p=PRODUCTS.find(x=>x.id===v('dnProd')), q=Number(v('dnQty'))||0;
  if(!p||q<=0){ toast('error','Enter the quantity ordered.'); return; }
  const e=state.dn.lines.find(l=>l.productId===p.id);
  if(e) e.ordered+=q; else state.dn.lines.push({productId:p.id,name:p.name,ordered:q,before:0,supply:null});
  render();
}
function saveDelivery(){
  const f=state.dn;
  if(!f.customer.trim()){ toast('error','Enter the customer name.'); return; }
  if(!f.lines.length){ toast('error','Add at least one item.'); return; }
  const sup=f.lines.map(dnSupply);
  if(!sup.some(s=>s>0)){ toast('error','Nothing to supply — no stock available.'); return; }
  let o=f.orderId&&ORDERS.find(x=>x.id===f.orderId);
  if(!o){ o={id:'ORD-'+String(ordSeq++).padStart(4,'0'),customer:f.customer.trim(),phone:f.phone,address:f.address,ref:f.ref,date:todayStr(),lines:f.lines.map(l=>({productId:l.productId,name:l.name,ordered:l.ordered,delivered:0}))}; ORDERS.push(o); }
  const no='DN-'+String(dnSeq++).padStart(4,'0'), lines=[];
  f.lines.forEach((l,i)=>{
    const ol=o.lines.find(x=>x.productId===l.productId), s=sup[i], p=PRODUCTS.find(x=>x.id===l.productId);
    if(s>0){ p.stock-=s; recalcProductStatus(p); ol.delivered+=s;
      STOCK_MOVEMENTS.push({id:'SM'+(4000+idc++),type:'out',productId:p.id,productName:p.name,qty:s,reason:'Delivery',notes:'Delivery note '+no,date:todayStr(),ref:no}); }
    lines.push({name:l.name,ordered:ol.ordered,before:ol.delivered-s,supplied:s,balance:ol.ordered-ol.delivered});
  });
  DELIVERIES.push({no,orderId:o.id,date:todayStr(),customer:o.customer,phone:o.phone,address:o.address,ref:o.ref,driver:f.driver,lines});
  logAudit('Created Delivery Note',`${no} for ${o.customer}`); toast('success',`Delivery note ${no} created`);
  openModal('viewDN',{no});
}
function dnView(no){
  const d=DELIVERIES.find(x=>x.no===no), partial=d.lines.some(l=>l.balance>0);
  return `<div id="printArea"><div style="display:flex;justify-content:space-between;margin-bottom:16px;"><div><div style="font-family:'Space Grotesk';font-weight:700;font-size:18px;">Fusion Business Manager</div><div class="cell-sub">Goods Delivery</div></div>
   <div style="text-align:right;"><div style="font-family:'Space Grotesk';font-weight:700;font-size:20px;">DELIVERY NOTE</div><div class="cell-sub">${d.no} · ${fmtDateLong(d.date)}</div><div class="cell-sub">Order ${d.orderId}${d.ref?' · Ref '+d.ref:''}</div>${partial?stBadge('Partly Delivered'):stBadge('Completed')}</div></div>
   <div class="grid grid-2" style="margin-bottom:14px;"><div><div class="cell-sub">DELIVER TO</div><div class="cell-strong">${d.customer}</div><div class="cell-sub">${d.address||''} ${d.phone||''}</div></div><div style="text-align:right;"><div class="cell-sub">DRIVER / VEHICLE</div><div>${d.driver||'—'}</div></div></div>
   <table class="data-table"><thead><tr><th>Item</th><th>Ordered</th><th>Delivered Before</th><th>Delivered Now</th><th>Balance Remaining</th></tr></thead><tbody>${d.lines.map(l=>`<tr><td>${l.name}</td><td>${l.ordered}</td><td>${l.before}</td><td class="cell-strong">${l.supplied}</td><td class="cell-strong">${l.balance}</td></tr>`).join('')}</tbody></table>
   ${partial?'<div class="cell-sub" style="margin-top:10px;">Partial delivery: the balance shown above will be supplied when stock is available.</div>':''}
   <div class="grid grid-2" style="margin-top:36px;"><div class="cell-sub">Delivered by: ____________________</div><div class="cell-sub">Received by (name, signature, date): ____________________</div></div></div>
   <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px;"><button class="btn btn-outline" onclick="window.print()">${ic('print')}Print</button>${partial?`<button class="btn btn-primary" onclick="deliverBalance('${d.orderId}')">Deliver Balance</button>`:''}</div>`;
}

/* ============================= INIT ============================= */
render();
</script>
</body>
</html>
